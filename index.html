<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173728">
<link rel="manifest" href="manifest.json">
<title>八ヶ岳クリスタルクエスト</title>
<style>
*{box-sizing:border-box}
:root{--gold:#f1cf65;--deep:#10281b;--paper:#fffdf5;--ink:#213126}
body{margin:0;min-height:100vh;background:linear-gradient(#173728,#08120d);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit}.app{width:min(100%,560px);min-height:100vh;margin:auto;padding:16px}
.sound-start{margin-bottom:10px;background:rgba(255,255,255,.11);color:#fff;border:1px solid rgba(255,255,255,.2)}.sound-start.on{border-color:#f1cf65;background:rgba(241,207,101,.16);color:#fff2ad}
.sync-status{min-height:20px;margin:0 0 10px;color:#cbd7ce;font-size:13px;text-align:center}.sync-status.error{color:#ffd28a}
.screen{display:none}.screen.active{display:block}.hero{text-align:center;padding:44px 8px 22px}.hero h1{font-size:clamp(38px,11vw,58px);line-height:1;margin:10px 0 18px}.sub{color:#cbd7ce;line-height:1.7}
.panel,.enemy{background:rgba(14,33,23,.9);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:18px;box-shadow:0 14px 40px rgba(0,0,0,.28)}
label{display:block;font-weight:800;margin:14px 0}input,select{width:100%;padding:14px;border:0;border-radius:12px;margin-top:8px}
.primary,.secondary{width:100%;border:0;border-radius:14px;padding:15px;font-weight:900}.primary{background:linear-gradient(135deg,#f4d56d,#e5aa39);color:#1b241d}.secondary{background:rgba(255,255,255,.11);color:#fff;border:1px solid rgba(255,255,255,.13);margin-top:10px}
.status{display:flex;justify-content:space-between;align-items:center;padding:4px 2px 14px}.status small{display:block;color:#cbd7ce}
.map{position:relative;min-height:980px;overflow:hidden;border-radius:24px;border:1px solid rgba(255,255,255,.15);background:linear-gradient(#2d6b43 0 30%,#477d4d 30% 58%,#a88d62 58% 76%,#294f3b 76%);box-shadow:inset 0 0 60px rgba(0,0,0,.35)}
.map-title{position:absolute;top:16px;left:10px;right:10px;text-align:center}.path{position:absolute;border-top:3px dashed rgba(255,242,195,.55);width:170px}.p1{top:185px;left:115px;transform:rotate(22deg)}.p2{top:320px;left:210px;transform:rotate(-24deg)}.p3{top:450px;left:120px;transform:rotate(18deg)}.p4{top:565px;left:205px;transform:rotate(-20deg)}
.node{position:absolute;width:116px;min-height:105px;padding:9px;border-radius:24px;border:2px solid rgba(255,255,255,.26);color:#fff;background:rgba(11,30,19,.84);text-align:center;box-shadow:0 12px 28px rgba(0,0,0,.35)}
.node .icon{display:block;font-size:40px}.node strong{font-size:13px;display:block}.node small{font-size:11px;color:#d5dfd7;display:block;margin-top:5px}.node.clear{background:rgba(24,102,51,.92);border-color:#91e1a9}.node.locked{filter:grayscale(.8);opacity:.65}.node.ready{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(242,207,99,.15),0 12px 28px rgba(0,0,0,.35)}}
.n1{top:90px;left:18px}.n2{top:205px;right:18px}.n3{top:325px;left:18px}.n4{top:445px;right:18px}.n5{bottom:20px;left:50%;transform:translateX(-50%)}.n6{top:565px;left:18px}.n7{top:685px;right:18px}.n8{top:805px;left:18px}
.enemy{text-align:center}.enemy-icon{font-size:88px}.hpbar{height:15px;background:#321d1d;border-radius:999px;overflow:hidden}.hpfill{height:100%;background:linear-gradient(90deg,#cf4848,#ef9b4b);transition:.3s}
.row{display:flex;justify-content:space-between;margin:8px 0}.message{min-height:58px;display:grid;place-items:center;text-align:center;color:#ffe88c;font-weight:900}.choices{display:grid;gap:10px}.choice{width:100%;padding:14px;border-radius:13px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.09);color:#fff;text-align:left;font-weight:700}.choice.correct{background:#287b45}.choice.wrong{background:#8d3030}.hidden{display:none!important}

/* 戦闘画面専用：ステージごとの本格RPGバトルフィールド */
#battle{
 --battle-accent:#8fda9e;
 --battle-border:rgba(185,235,196,.72);
 --battle-aura:rgba(105,228,135,.42);
 --battle-name:#f5ffe9;
 --battle-window:rgba(5,18,12,.9);
 --battle-texture:linear-gradient(transparent,transparent);
 --battle-texture-size:auto;
 --battle-texture-opacity:.42;
 --battle-bg:linear-gradient(180deg,#18452d,#07150e);
 position:relative;
 isolation:isolate;
 min-height:calc(100vh - 32px);
 padding:12px;
 overflow:hidden;
 border:1px solid var(--battle-border);
 border-radius:26px;
 background:var(--battle-bg);
 box-shadow:inset 0 0 80px rgba(0,0,0,.58),0 18px 46px rgba(0,0,0,.34);
}
#battle::before{
 content:"";
 position:absolute;
 inset:0;
 z-index:-2;
 pointer-events:none;
 background:var(--battle-texture);
 background-size:var(--battle-texture-size);
 opacity:var(--battle-texture-opacity);
}
#battle::after{
 content:"";
 position:absolute;
 inset:0;
 z-index:-1;
 pointer-events:none;
 background:radial-gradient(circle at 50% 30%,transparent 0 28%,rgba(0,0,0,.18) 62%,rgba(0,0,0,.72) 100%);
}
#battle>*{position:relative;z-index:1}
#battle .status{
 margin-bottom:12px;
 padding:10px 12px;
 border:1px solid var(--battle-border);
 border-radius:14px;
 background:linear-gradient(180deg,rgba(4,12,8,.82),rgba(7,20,13,.72));
 box-shadow:inset 0 1px rgba(255,255,255,.08),0 8px 24px rgba(0,0,0,.28);
 backdrop-filter:blur(8px);
}
#battle .status .secondary{
 border-color:var(--battle-border);
 background:rgba(0,0,0,.32);
 box-shadow:inset 0 1px rgba(255,255,255,.08);
}
#battle .enemy{
 position:relative;
 min-height:340px;
 padding:18px 18px 20px;
 overflow:hidden;
 border:2px solid var(--battle-border);
 border-radius:20px;
 background:linear-gradient(180deg,rgba(5,13,9,.58),rgba(3,8,6,.88));
 box-shadow:inset 0 0 34px rgba(255,255,255,.04),0 18px 40px rgba(0,0,0,.42),0 0 24px var(--battle-aura);
 backdrop-filter:blur(4px);
}
#battle .enemy::before{
 content:"";
 position:absolute;
 inset:-20% 8% 20%;
 z-index:0;
 pointer-events:none;
 border-radius:50%;
 background:radial-gradient(circle,var(--battle-aura) 0,transparent 66%);
 filter:blur(8px);
}
#battle .enemy>*{position:relative;z-index:1}
#battle .enemy-icon{
 position:relative;
 isolation:isolate;
 display:grid;
 place-items:center;
 width:clamp(154px,44vw,214px);
 height:clamp(154px,44vw,214px);
 margin:-6px auto -8px;
 font-size:clamp(112px,32vw,158px);
 line-height:1;
 transform-origin:50% 72%;
 filter:drop-shadow(0 18px 12px rgba(0,0,0,.55)) drop-shadow(0 0 24px var(--battle-aura));
 animation:rpg-enemy-float 2.8s ease-in-out infinite;
}
#battle .enemy-icon::before{
 content:"";
 position:absolute;
 inset:12%;
 z-index:-1;
 border:2px solid var(--battle-border);
 border-radius:50%;
 background:radial-gradient(circle,var(--battle-aura),transparent 67%);
 box-shadow:0 0 22px var(--battle-aura),inset 0 0 28px var(--battle-aura);
 animation:rpg-aura-pulse 2s ease-in-out infinite;
}
#battle #enemyName{
 margin:2px 0 14px;
 color:var(--battle-name);
 font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif;
 font-size:clamp(26px,7vw,38px);
 line-height:1.2;
 letter-spacing:.04em;
 text-shadow:0 3px 2px rgba(0,0,0,.88),0 0 16px var(--battle-aura);
}
#battle .row{
 align-items:center;
 margin:10px 2px 7px;
 color:#fff4c5;
 font-weight:900;
 text-shadow:0 2px 2px #000;
}
#battle .hpbar{
 height:25px;
 padding:3px;
 overflow:hidden;
 border:2px solid #e9b95a;
 border-radius:8px;
 background:#210707;
 box-shadow:inset 0 3px 8px #050000,0 0 12px rgba(255,118,45,.3);
}
#battle .hpfill{
 position:relative;
 height:100%;
 overflow:hidden;
 border-radius:4px;
 background:linear-gradient(90deg,#8f0d15 0%,#d52d1f 48%,#ff8a25 100%);
 box-shadow:inset 0 2px rgba(255,255,255,.34),inset 0 -3px rgba(83,0,0,.38),0 0 10px rgba(255,82,24,.55);
}
#battle .hpfill::after{
 content:"";
 position:absolute;
 inset:1px 0 auto;
 height:35%;
 background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,.5),rgba(255,255,255,.08));
}
#battle .message{
 min-height:68px;
 margin:11px 0;
 padding:10px 14px;
 border-top:1px solid var(--battle-border);
 border-bottom:1px solid var(--battle-border);
 background:linear-gradient(90deg,transparent,rgba(0,0,0,.55) 18% 82%,transparent);
 color:#ffe995;
 font-size:clamp(16px,4.7vw,20px);
 text-shadow:0 2px 3px #000;
}
#battle .panel{
 position:relative;
 padding:18px;
 border:2px solid var(--battle-border);
 border-radius:10px;
 background:linear-gradient(145deg,rgba(255,255,255,.08),var(--battle-window) 24%,var(--battle-window));
 box-shadow:inset 0 0 0 2px rgba(255,255,255,.06),inset 0 0 28px rgba(0,0,0,.42),0 14px 30px rgba(0,0,0,.36);
}
#battle .panel::before,#battle .panel::after{
 content:"◆";
 position:absolute;
 color:var(--battle-accent);
 font-size:12px;
 text-shadow:0 0 8px var(--battle-aura);
}
#battle .panel::before{top:5px;left:7px}
#battle .panel::after{right:7px;bottom:5px}
#battle #qNo{
 color:var(--battle-accent);
 font-size:13px;
 font-weight:900;
 letter-spacing:.12em;
 text-transform:uppercase;
}
#battle #qText{
 margin:9px 0 17px;
 color:#fff;
 font-family:Georgia,"Yu Mincho","Hiragino Mincho ProN",serif;
 font-size:clamp(20px,5.5vw,27px);
 line-height:1.45;
 text-shadow:0 2px 2px #000;
}
#battle .choices{gap:11px}
#battle .choice{
 position:relative;
 min-height:58px;
 padding:14px 16px 14px 44px;
 border:2px solid var(--battle-border);
 border-radius:8px;
 background:linear-gradient(180deg,rgba(38,58,47,.96),rgba(9,22,15,.98));
 box-shadow:inset 0 1px rgba(255,255,255,.13),0 5px 0 rgba(0,0,0,.38),0 8px 16px rgba(0,0,0,.25);
 color:#fff;
 font-size:clamp(16px,4.5vw,19px);
 font-weight:900;
 line-height:1.35;
 text-shadow:0 2px 2px #000;
 transition:transform .12s ease,border-color .12s ease,filter .12s ease;
}
#battle .choice::before{
 content:"▶";
 position:absolute;
 left:16px;
 top:50%;
 color:var(--battle-accent);
 transform:translateY(-50%);
 text-shadow:0 0 9px var(--battle-aura);
}
#battle .choice:hover:not(:disabled),#battle .choice:focus-visible{
 border-color:#fff2b0;
 filter:brightness(1.16);
 transform:translateY(-1px);
}
#battle .choice:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 1px rgba(255,255,255,.08),0 2px 0 rgba(0,0,0,.45)}
#battle .choice:disabled{cursor:default;opacity:.92}
#battle .choice.correct{
 border-color:#88ed9f;
 background:linear-gradient(180deg,#267842,#164829);
 color:#fff;
}
#battle .choice.wrong{
 border-color:#ff8b79;
 background:linear-gradient(180deg,#9b302b,#571916);
 color:#fff;
}
#battle>.primary{
 margin-top:12px;
 border:2px solid #f4d56d;
 border-radius:8px;
 box-shadow:inset 0 1px rgba(255,255,255,.38),0 5px 0 #7f5315;
}

#battle[data-stage="slime"]{
 --battle-accent:#8fdf83;--battle-border:rgba(145,225,169,.76);--battle-aura:rgba(83,218,112,.45);
 --battle-bg:radial-gradient(circle at 50% 17%,rgba(194,239,123,.3),transparent 25%),linear-gradient(90deg,rgba(2,20,10,.86),transparent 24% 76%,rgba(2,20,10,.86)),linear-gradient(180deg,#1f6238 0%,#0d3422 52%,#06170f 100%);
 --battle-texture:repeating-linear-gradient(88deg,transparent 0 10%,rgba(1,18,8,.58) 11% 15%,transparent 16% 28%),linear-gradient(155deg,transparent 0 46%,rgba(157,213,93,.22) 47% 49%,transparent 50%);
}
#battle[data-stage="goblin"]{
 --battle-accent:#e1aa62;--battle-border:rgba(219,161,91,.76);--battle-aura:rgba(226,128,47,.38);--battle-name:#fff1d1;--battle-window:rgba(32,18,9,.92);
 --battle-bg:radial-gradient(circle at 50% 18%,rgba(255,190,96,.2),transparent 28%),linear-gradient(155deg,transparent 0 46%,rgba(40,23,13,.66) 47% 61%,transparent 62%),linear-gradient(180deg,#735033 0%,#3c281b 54%,#17100c 100%);
 --battle-texture:repeating-linear-gradient(145deg,rgba(255,255,255,.04) 0 2px,transparent 2px 28px),radial-gradient(ellipse at 12% 72%,rgba(20,12,8,.75) 0 9%,transparent 10%),radial-gradient(ellipse at 88% 42%,rgba(31,18,12,.66) 0 12%,transparent 13%);
}
#battle[data-stage="ghost"]{
 --battle-accent:#bceeff;--battle-border:rgba(195,238,255,.78);--battle-aura:rgba(161,229,255,.5);--battle-name:#f0fdff;--battle-window:rgba(8,29,38,.9);
 --battle-bg:radial-gradient(ellipse at 24% 35%,rgba(229,251,255,.42),transparent 24%),radial-gradient(ellipse at 78% 52%,rgba(208,245,255,.32),transparent 26%),linear-gradient(180deg,#477c88 0%,#1b4b5a 48%,#092431 100%);
 --battle-texture:repeating-radial-gradient(ellipse at 50% 100%,rgba(255,255,255,.16) 0 3%,transparent 5% 14%);
 --battle-texture-size:140% 70%;
}
#battle[data-stage="food"]{
 --battle-accent:#e8b66f;--battle-border:rgba(232,174,104,.82);--battle-aura:rgba(224,92,53,.38);--battle-name:#fff0d6;--battle-window:rgba(42,13,10,.92);
 --battle-bg:radial-gradient(circle at 50% 18%,rgba(255,204,116,.25),transparent 25%),linear-gradient(90deg,rgba(86,30,22,.75),transparent 27% 73%,rgba(86,30,22,.75)),linear-gradient(180deg,#773c2e 0%,#4b211b 56%,#1f0c0b 100%);
 --battle-texture:repeating-linear-gradient(90deg,transparent 0 48px,rgba(255,211,137,.11) 49px 51px),repeating-linear-gradient(0deg,transparent 0 46px,rgba(255,211,137,.08) 47px 49px);
}
#battle[data-stage="star"]{
 --battle-accent:#f3df82;--battle-border:rgba(241,218,116,.78);--battle-aura:rgba(124,149,255,.48);--battle-name:#fff8c8;--battle-window:rgba(6,11,38,.92);
 --battle-bg:radial-gradient(circle at 50% 24%,rgba(86,102,224,.34),transparent 28%),linear-gradient(180deg,#11194d 0%,#080d2f 56%,#030617 100%);
 --battle-texture:radial-gradient(circle at 12% 15%,#fff 0 1px,transparent 2px),radial-gradient(circle at 77% 22%,#ffe893 0 1px,transparent 2px),radial-gradient(circle at 42% 62%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 88% 76%,#b9d9ff 0 1px,transparent 2px);
 --battle-texture-size:92px 84px,137px 121px,173px 157px,211px 189px;--battle-texture-opacity:.9;
}
#battle[data-stage="wolf"]{
 --battle-accent:#c9efff;--battle-border:rgba(216,245,255,.88);--battle-aura:rgba(129,210,255,.48);--battle-name:#fff;--battle-window:rgba(8,27,43,.9);
 --battle-bg:radial-gradient(circle at 50% 16%,rgba(255,255,255,.52),transparent 25%),linear-gradient(168deg,transparent 0 48%,rgba(231,249,255,.38) 49% 62%,transparent 63%),linear-gradient(180deg,#78acc7 0%,#42768f 42%,#173c55 100%);
 --battle-texture:repeating-linear-gradient(160deg,rgba(255,255,255,.2) 0 2px,transparent 2px 42px),radial-gradient(ellipse at 50% 100%,rgba(239,251,255,.48),transparent 58%);
}
#battle[data-stage="golem"]{
 --battle-accent:#9ac87e;--battle-border:rgba(155,194,123,.78);--battle-aura:rgba(91,150,72,.48);--battle-name:#e9f4cf;--battle-window:rgba(10,24,13,.94);
 --battle-bg:radial-gradient(circle at 50% 26%,rgba(109,155,72,.25),transparent 27%),linear-gradient(138deg,transparent 0 43%,rgba(25,31,22,.68) 44% 57%,transparent 58%),linear-gradient(180deg,#3a4935 0%,#242f24 50%,#0e160f 100%);
 --battle-texture:repeating-linear-gradient(132deg,rgba(0,0,0,.24) 0 3px,transparent 3px 44px),radial-gradient(circle at 15% 36%,rgba(76,129,57,.42) 0 8%,transparent 9%),radial-gradient(circle at 84% 70%,rgba(70,119,52,.34) 0 10%,transparent 11%);
}
#battle[data-stage="boss"]{
 --battle-accent:#e4be59;--battle-border:rgba(226,188,80,.92);--battle-aura:rgba(157,64,255,.6);--battle-name:#ffe9a1;--battle-window:rgba(13,4,25,.96);
 --battle-bg:radial-gradient(circle at 50% 25%,rgba(128,34,207,.48),transparent 27%),radial-gradient(circle at 50% 50%,rgba(63,12,103,.5),transparent 50%),linear-gradient(180deg,#1e082f 0%,#09030f 58%,#020104 100%);
 --battle-texture:repeating-conic-gradient(from 15deg at 50% 45%,rgba(224,185,76,.07) 0 4deg,transparent 5deg 26deg),radial-gradient(circle at 20% 18%,rgba(236,204,105,.6) 0 1px,transparent 2px),radial-gradient(circle at 82% 30%,rgba(187,116,255,.7) 0 1px,transparent 2px);
 --battle-texture-size:auto,120px 120px,170px 170px;--battle-texture-opacity:.86;
}
#battle[data-stage="boss"] .enemy{
 border-color:#e4be59;
 background:linear-gradient(180deg,rgba(33,8,55,.62),rgba(5,1,10,.94));
 box-shadow:inset 0 0 38px rgba(137,48,211,.25),0 18px 46px rgba(0,0,0,.72),0 0 28px rgba(221,179,63,.34);
}
#battle[data-stage="boss"] .enemy::after{
 content:"";
 position:absolute;
 inset:10px;
 z-index:0;
 pointer-events:none;
 border:1px solid rgba(228,190,89,.55);
 border-radius:15px;
 box-shadow:inset 0 0 24px rgba(132,41,215,.32);
}
#battle[data-stage="boss"] .enemy-icon{
 filter:drop-shadow(0 20px 14px #000) drop-shadow(0 0 25px rgba(182,84,255,.9)) drop-shadow(0 0 8px #e4be59);
 animation-duration:2.15s;
}
#battle[data-stage="boss"] #enemyName{
 color:#ffe9a1;
 text-shadow:0 4px 3px #000,0 0 12px #7e25c8,0 0 25px rgba(228,190,89,.55);
}
#battle[data-stage="boss"] .hpbar{border-color:#e4be59;box-shadow:inset 0 3px 8px #050000,0 0 16px rgba(172,66,255,.52)}

@keyframes rpg-enemy-float{0%,100%{transform:translateY(2px) scale(1)}50%{transform:translateY(-9px) scale(1.025)}}
@keyframes rpg-aura-pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.08)}}
@media(max-width:480px){
 #battle{min-height:calc(100vh - 24px);padding:8px;border-radius:18px}
 #battle .status{padding:8px 9px;font-size:13px}
 #battle .enemy{min-height:292px;padding:13px 12px 16px;border-radius:16px}
 #battle .enemy-icon{width:clamp(140px,46vw,178px);height:clamp(140px,46vw,178px);font-size:clamp(102px,34vw,132px)}
 #battle #enemyName{font-size:clamp(24px,7.5vw,31px);margin-bottom:12px}
 #battle .hpbar{height:23px}
 #battle .message{min-height:60px;margin:8px 0;font-size:16px}
 #battle .panel{padding:15px 12px}
 #battle #qText{font-size:clamp(19px,5.8vw,24px);margin-bottom:14px}
 #battle .choice{min-height:56px;padding:13px 12px 13px 39px;font-size:16px}
 #battle .choice::before{left:13px}
}
@media(prefers-reduced-motion:reduce){
 #battle .enemy-icon,#battle .enemy-icon::before{animation:none!important}
 #battle .choice{transition:none!important}
}

.confetti{font-size:42px;letter-spacing:8px;animation:float 1.5s ease-in-out infinite alternate}@keyframes float{to{transform:translateY(-8px)}}

<body>
<main class="app">
<section id="start" class="screen active">
<div class="hero"><div>QR体験型RPG</div><h1>八ヶ岳<br>クリスタルクエスト</h1><p class="sub">7つのクリスタルを集め、魔王を倒して認定証を手に入れよう。</p></div>
<div class="panel">
<label>勇者の名前<input id="name" maxlength="12" placeholder="なまえ"></label>
<label>難易度<select id="difficulty"><option value="kids">キッズ勇者</option><option value="adult">大人勇者</option></select></label>

<button id="startBtn" class="primary" disabled>冒険を始める</button>
</div>
</section>

<section id="map" class="screen">
<div class="status"><div><b id="mapName"></b><small>HP <span id="mapHp">100</span>/100</small></div><div>💎 <b id="crystals">0</b>/7</div></div>
<div class="map">
<div class="map-title"><b>八ヶ岳 冒険マップ</b><br><small>QRを読み込むか、地点をタップ</small></div>

<button class="node n1" data-stage="slime"></button><button class="node n2" data-stage="goblin"></button><button class="node n3" data-stage="ghost"></button><button class="node n4" data-stage="food"></button><button class="node n6" data-stage="star"></button><button class="node n7" data-stage="wolf"></button><button class="node n8" data-stage="golem"></button><button class="node n5" data-stage="boss"></button>
</div>

<section id="battle" class="screen">

<div class="enemy"><div id="enemyIcon" class="enemy-icon">👾</div><h2 id="enemyName"></h2><div class="row"><span>敵HP</span><span><b id="enemyHp"></b>/<span id="enemyMax"></span></span></div><div class="hpbar"><div id="hpfill" class="hpfill"></div></div></div>

<div class="confetti">✨🎉✨</div><div style="font-size:82px">🏆</div><h1>魔王撃破！</h1><p id="endingText" class="sub"></p>
<button id="certificateBtn" class="primary">認定証を見る</button>
</div>
</section>

<section id="certificateScreen" class="screen">
<div class="hero"><div>QUEST COMPLETE</div><h1>勇者認定証</h1></div>
<div id="certificate" class="certificate">
<div>八ヶ岳クリスタルクエスト</div>
<h2>勇者認定証</h2>
<p>あなたは7つのクリスタルを集め、<br>闇の魔王ノクスを倒しました。</p>
<div id="certName" class="name"></div>

</div>

</div>
<div class="action-grid">

</div>
</section>
</main>
<div id="effectLayer" class="effect-layer" aria-live="polite"></div>

<script>
const stages=[
{id:"slime",name:"森のスライム",icon:"🟢",hp:60,damage:30,crystal:true,q:[["森にいる動物は？",["リス","イルカ","ラクダ"],0],["ごみはどうする？",["持ち帰る","置いていく","川に流す"],0],["木の葉に多い色は？",["みどり","ぎん","くろ"],0]]},
{id:"goblin",name:"ドリフトゴブリン",icon:"👺",hp:90,damage:30,crystal:true,q:[["運動前にすることは？",["準備体操","全力疾走","寝る"],0],["転んだ人がいたら？",["声をかける","笑う","逃げる"],0],["順番を守るには？",["並ぶ","抜かす","隠れる"],0]]},
{id:"ghost",name:"湯けむりゴースト",icon:"👻",hp:90,damage:30,crystal:true,q:[["浴場でしてはいけないことは？",["走る","静かに歩く","体を洗う"],0],["タオルは湯船に？",["入れない","入れる","投げる"],0],["入浴前にすることは？",["体を洗う","走る","食べる"],0]]},
{id:"food",name:"フードロスモンスター",icon:"🍽️",hp:90,damage:30,crystal:true,q:[["食べられる分だけ取る理由は？",["残さないため","皿を増やすため","遊ぶため"],0],["食事前の言葉は？",["いただきます","おやすみ","さようなら"],0],["食後の言葉は？",["ごちそうさま","こんにちは","いってきます"],0]]},
{id:"star",name:"星降るウィザード",icon:"🧙‍♂️",hp:90,damage:30,crystal:true,q:[["夜空で光って見えるものは？",["星","石","木の根"],0],["星を見るときに適した場所は？",["暗い場所","明るい部屋","テレビの前"],0],["夜空を観察するときに大切なのは？",["安全な場所で見る","道路に飛び出す","一人で遠くへ行く"],0]]},
{id:"wolf",name:"雪原のホワイトウルフ",icon:"🐺",hp:90,damage:30,crystal:true,q:[["寒い日に必要なものは？",["防寒着","水着","うちわ"],0],["雪道で安全な歩き方は？",["ゆっくり歩く","全力で走る","目を閉じる"],0],["冬の屋外で大切なのは？",["体を冷やしすぎない","薄着で長時間遊ぶ","水分を取らない"],0]]},
{id:"golem",name:"森のゴーレム",icon:"🗿",hp:120,damage:40,crystal:true,q:[["森の植物を守る行動は？",["道から外れない","枝を折る","花を全部摘む"],0],["野生動物を見つけたら？",["離れて観察する","追いかける","餌をあげる"],0],["森にごみを残してはいけない理由は？",["自然や動物を守るため","木を高くするため","雨を止めるため"],0]]},
{id:"boss",name:"闇の魔王ノクス",icon:"🐉",hp:120,damage:40,crystal:false,boss:true,q:[["仲間と大切なのは？",["助け合う","けんかする","置いていく"],0],["困ったときは？",["スタッフに相談","隠れる","走る"],0],["自然を守るには？",["ごみを持ち帰る","枝を折る","動物を追う"],0]]}
];
const state={name:"",difficulty:"kids",hp:100,crystals:0,cleared:[],stage:null,enemyHp:0,q:0,completed:false,certificate:null};
const $=id=>document.getElementById(id), stageById=id=>stages.find(s=>s.id===id);
function requestedStageId(){const id=new URLSearchParams(location.search).get("stage");return id&&stageById(id)?id:null}
let originalRetroAudioContext=null,originalRetroSoundEnabled=false;
function originalRetroGetAudio(){if(!originalRetroSoundEnabled||!originalRetroAudioContext)return null;if(originalRetroAudioContext.state==="suspended")originalRetroAudioContext.resume().catch(()=>{});return originalRetroAudioContext}
function originalRetroTone(frequency,delay,duration,type="square",volume=.025,endFrequency=null){const audio=originalRetroGetAudio();if(!audio)return;const start=audio.currentTime+delay,osc=audio.createOscillator(),gain=audio.createGain();osc.type=type;osc.frequency.setValueAtTime(frequency,start);if(endFrequency)osc.frequency.exponentialRampToValueAtTime(endFrequency,start+duration);gain.gain.setValueAtTime(.0001,start);gain.gain.exponentialRampToValueAtTime(volume,start+.012);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);osc.connect(gain);gain.connect(audio.destination);osc.start(start);osc.stop(start+duration+.02)}
function originalRetroNoise(delay,duration,volume=.018){const audio=originalRetroGetAudio();if(!audio)return;const length=Math.max(1,Math.floor(audio.sampleRate*duration)),buffer=audio.createBuffer(1,length,audio.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<length;i++)data[i]=(Math.random()*2-1)*(1-i/length);const source=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain(),start=audio.currentTime+delay;source.buffer=buffer;filter.type="lowpass";filter.frequency.value=650;gain.gain.setValueAtTime(volume,start);gain.gain.exponentialRampToValueAtTime(.0001,start+duration);source.connect(filter);filter.connect(gain);gain.connect(audio.destination);source.start(start)}
function originalRetroConfirmSound(){originalRetroTone(520,0,.07,"square",.018,610);originalRetroTone(760,.075,.09,"square",.016,850)}
function originalRetroStartSound(){originalRetroTone(170,0,.18,"sawtooth",.022,125);originalRetroTone(118,.13,.3,"square",.018,82);originalRetroNoise(.08,.22,.008)}
function originalRetroCorrectSound(){originalRetroTone(420,0,.08,"square",.018,510);originalRetroTone(590,.07,.09,"square",.019,700);originalRetroTone(830,.15,.14,"triangle",.022,980)}
function originalRetroWrongSound(){originalRetroTone(150,0,.16,"sawtooth",.025,82);originalRetroNoise(0,.13,.012)}
function originalRetroCrystalSound(){[740,990,1240,1660].forEach((f,i)=>originalRetroTone(f,i*.065,.13,"triangle",.017,f*1.08));originalRetroTone(2080,.27,.25,"sine",.012,2250)}
function originalRetroUnlockSound(){[196,247,311,392,523,659].forEach((f,i)=>originalRetroTone(f,i*.13,.22,i<3?"triangle":"square",.016,f*1.04));originalRetroTone(988,.76,.5,"sine",.018,1320)}
function originalRetroVictorySound(){const notes=[[262,0,.13],[349,.12,.13],[294,.24,.13],[440,.36,.2],[392,.58,.12],[523,.7,.13],[466,.82,.13],[659,.94,.38]];notes.forEach(([f,d,t],i)=>originalRetroTone(f,d,t,i%3===0?"triangle":"square",.017,f*1.015));originalRetroTone(330,.94,.38,"triangle",.009,335)}
async function enableSound(){const button=$("soundOnBtn"),AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass){originalRetroSoundEnabled=false;button.textContent="🔇 音声非対応";button.disabled=true;return}try{if(!originalRetroAudioContext)originalRetroAudioContext=new AudioContextClass();await originalRetroAudioContext.resume();originalRetroSoundEnabled=true;button.textContent="🔊 音ON";button.classList.add("on");button.setAttribute("aria-pressed","true");originalRetroConfirmSound()}catch(error){originalRetroSoundEnabled=false;button.textContent="🔇 音声を利用できません";button.disabled=true;console.warn("音声機能を開始できませんでした。",error)}}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")}
let syncReady=false;
function applySyncedState(saved){if(!saved||typeof saved!=="object")return;Object.assign(state,saved);state.cleared=Array.isArray(state.cleared)?state.cleared:[];state.crystals=Number(state.crystals||0);state.hp=Number(state.hp??100);state.enemyHp=Number(state.enemyHp||0);state.q=Number(state.q||0);$("name").value=state.name||"";$("difficulty").value=state.difficulty==="adult"?"adult":"kids";if(!state.name){show("start");return}if(state.completed&&location.hash==="#certificate"){showCertificate();return}const requestedStage=requestedStageId();if(requestedStage){renderMap();show("map");direct(requestedStage);return}const activeStage=stageById(state.stage);if(activeStage&&state.enemyHp>0&&!state.cleared.includes(activeStage.id)){renderBattle();show("battle");return}renderMap();show("map")}
function finishSync(message="保存データの確認が完了しました。"){syncReady=true;$("startBtn").disabled=false;$("syncStatus").textContent=message}
window.yatsuRpgApplySyncedState=applySyncedState;
window.yatsuRpgFinishSync=finishSync;
function showEffectMessage(text,type="",duration=1500){const layer=$("effectLayer");const banner=document.createElement("div");banner.className="effect-banner "+type;banner.textContent=text;layer.appendChild(banner);setTimeout(()=>banner.remove(),duration)}
function battleIntro(s){showEffectMessage(`${s.icon} ${s.name}\n敵があらわれた！`);originalRetroStartSound()}
function attackEffect(damage){const enemy=$("enemyIcon"),rect=enemy.getBoundingClientRect();enemy.classList.remove("enemy-hit");void enemy.offsetWidth;enemy.classList.add("enemy-hit");const slash=document.createElement("div");slash.className="attack-slash";slash.style.left=(rect.left+rect.width/2-75)+"px";slash.style.top=(rect.top+rect.height/2)+"px";document.body.appendChild(slash);const number=document.createElement("div");number.className="damage-number";number.textContent=`-${damage}`;number.style.left=(rect.left+rect.width/2-35)+"px";number.style.top=(rect.top+10)+"px";document.body.appendChild(number);setTimeout(()=>{slash.remove();number.remove();enemy.classList.remove("enemy-hit")},750)}
function wrongEffect(){const app=document.querySelector(".app"),flash=document.createElement("div");flash.className="red-flash";document.body.appendChild(flash);app.classList.remove("screen-shake");void app.offsetWidth;app.classList.add("screen-shake");setTimeout(()=>{flash.remove();app.classList.remove("screen-shake")},450)}
function bossConfetti(){const colors=["#f1cf65","#ff5b5b","#65d9ff","#85e889","#d48cff","#fff"];for(let i=0;i<90;i++){const piece=document.createElement("i");piece.className="confetti-piece";piece.style.left=Math.random()*100+"vw";piece.style.background=colors[i%colors.length];piece.style.setProperty("--drift",(Math.random()*240-120)+"px");piece.style.setProperty("--fall-time",(2.4+Math.random()*2)+"s");piece.style.animationDelay=Math.random()*.8+"s";document.body.appendChild(piece);setTimeout(()=>piece.remove(),5200)}}
function save(immediate=false){try{localStorage.setItem("qrRpgCertV2",JSON.stringify(state))}catch(error){console.error("端末への一時保存失敗:",error)}if(typeof window.yatsuRpgSaveState==="function")window.yatsuRpgSaveState(state,{immediate})}
function renderMap(){$("mapName").textContent=state.name;$("mapHp").textContent=state.hp;$("crystals").textContent=state.crystals;document.querySelectorAll(".node").forEach(n=>{const s=stageById(n.dataset.stage),clear=state.cleared.includes(s.id),locked=s.boss&&state.crystals<7;n.disabled=clear||locked;n.classList.toggle("clear",clear);n.classList.toggle("locked",locked);n.classList.toggle("ready",s.boss&&!clear&&!locked);n.innerHTML=`<span class="icon">${locked?"🔒":clear?"✅":s.icon}</span><strong>${s.name}</strong><small>${locked?"7つで解放":clear?"CLEAR":"挑戦する"}</small>`;n.onclick=()=>startBattle(s.id)})}
function startBattle(id){const s=stageById(id);if(s.boss&&state.crystals<7){alert("クリスタルが7つ必要です");return}if(state.completed&&id==="boss"){showCertificate();return}state.stage=id;state.enemyHp=s.hp;state.q=0;if(state.hp<=0)state.hp=100;save();renderBattle();show("battle");requestAnimationFrame(()=>battleIntro(s))}
function renderBattle(){const s=stageById(state.stage);$("battle").dataset.stage=s.id;$("enemyIcon").textContent=s.icon;$("enemyName").textContent=s.name;$("enemyMax").textContent=s.hp;$("playerHp").textContent=state.hp;updateEnemy(s);renderQuestion(s)}
function updateEnemy(s){$("enemyHp").textContent=Math.max(0,state.enemyHp);$("hpfill").style.width=Math.max(0,state.enemyHp/s.hp*100)+"%"}
function renderQuestion(s){const src=s.q[state.q%s.q.length],items=src[1].map((t,i)=>({t,c:i===src[2]})).sort(()=>Math.random()-.5);$("qNo").textContent="問題 "+(state.q+1);$("qText").textContent=src[0];$("message").textContent="答えを選んで攻撃しよう";$("nextBtn").classList.add("hidden");$("returnBtn").classList.add("hidden");const box=$("choices");box.innerHTML="";items.forEach(it=>{const b=document.createElement("button");b.className="choice";b.textContent=it.t;b.dataset.correct=it.c?"1":"0";b.onclick=()=>answer(b,it.c,s);box.appendChild(b)})}
function answer(b,correct,s){const btns=[...document.querySelectorAll(".choice")];btns.forEach(x=>x.disabled=true);if(correct){b.classList.add("correct");state.enemyHp-=s.damage;$("message").textContent="正解！ "+s.damage+"ダメージ！";attackEffect(s.damage);originalRetroCorrectSound()}else{b.classList.add("wrong");btns.find(x=>x.dataset.correct==="1").classList.add("correct");state.hp=Math.max(0,state.hp-20);$("message").textContent="不正解。勇者は20ダメージ！";wrongEffect();originalRetroWrongSound()}$("playerHp").textContent=state.hp;updateEnemy(s);save();if(state.enemyHp<=0){setTimeout(()=>win(s),520);return}if(state.hp<=0){$("message").textContent="勇者は倒れた。再挑戦しよう";$("returnBtn").classList.remove("hidden");return}$("nextBtn").classList.remove("hidden")}
function rank(){return state.hp>=80?"黄金の勇者":state.hp>=40?"銀翼の勇者":"不屈の勇者"}
function makeCertificate(){const now=new Date();const date=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日`;const code="YATSU-"+Math.floor(100000+Math.random()*900000);state.certificate={date,code,rank:rank()};state.completed=true;save(true)}
function win(s){const firstClear=!state.cleared.includes(s.id);if(firstClear){state.cleared.push(s.id);if(s.crystal)state.crystals++}if(s.boss){if(!state.certificate)makeCertificate();$("endingText").textContent=state.name+"は魔王を倒し、八ヶ岳の平和を取り戻した！";save(true);show("ending");bossConfetti();originalRetroVictorySound()}else{$("message").textContent=s.name+"を倒した！クリスタルを獲得！";save(true);$("returnBtn").classList.remove("hidden");if(firstClear&&s.crystal){showEffectMessage("💎 クリスタルを手に入れた！","crystal");originalRetroCrystalSound();if(state.crystals===7)setTimeout(()=>{showEffectMessage("⚔️ 魔王への道が開かれた！","unlock",1800);originalRetroUnlockSound()},1550)}}}
function showCertificate(){if(!state.certificate)makeCertificate();$("certName").textContent=state.name+" 殿";$("certRank").textContent=state.certificate.rank;$("certDate").textContent=state.certificate.date;$("certCode").textContent="認定コード："+state.certificate.code;show("certificateScreen")}
function direct(id=requestedStageId()){if(!id||!stageById(id)||!state.name)return false;const resumeCurrentBattle=state.stage===id&&state.enemyHp>0&&!state.cleared.includes(id);if(resumeCurrentBattle){renderBattle();show("battle");return true}startBattle(id);return true}
$("startBtn").onclick=()=>{if(!syncReady)return;const n=$("name").value.trim();if(!n)return alert("名前を入力してください");Object.assign(state,{name:n,difficulty:$("difficulty").value,hp:100,crystals:0,cleared:[],stage:null,enemyHp:0,q:0,completed:false,certificate:null});save(true);renderMap();show("map");direct()}
$("nextBtn").onclick=()=>{state.q++;save();renderQuestion(stageById(state.stage))};$("returnBtn").onclick=$("mapBtn").onclick=()=>{renderMap();show("map")}
$("certificateBtn").onclick=showCertificate;$("printBtn").onclick=()=>window.print();$("mapReturnBtn").onclick=()=>{renderMap();show("map")}
$("resetBtn").onclick=$("againBtn").onclick=async()=>{$("resetBtn").disabled=true;$("againBtn").disabled=true;try{if(typeof window.yatsuRpgResetPlayer==="function")await window.yatsuRpgResetPlayer();else localStorage.removeItem("qrRpgCertV2")}catch(error){console.error("進捗リセット処理失敗:",error)}location.href=location.pathname}
setTimeout(()=>{if(syncReady)return;try{const saved=localStorage.getItem("qrRpgCertV2");if(saved)applySyncedState(JSON.parse(saved))}catch(error){console.error("端末保存の復元失敗:",error)}$("syncStatus").classList.add("error");finishSync("クラウド確認に時間がかかっています。端末保存で開始できます。")},8000)
if("serviceWorker" in navigator){navigator.serviceWorker.register("service-worker.js").catch(()=>{})}
</script>
